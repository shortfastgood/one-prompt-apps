<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pac-Man</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    canvas { display: block; width: min(800px, 100vw, calc(100vh * 4 / 3)); height: auto; }
  </style>
</head>
<body>
<canvas id="game" width="800" height="600" aria-label="Pac-Man. Press an arrow once to move one cell; holding does not move, Space restarts after game over, Escape stops.">Pac-Man requires a browser with Canvas support.</canvas>
<script>
'use strict';
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const directions = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const arrows = { ArrowRight: directions[0], ArrowLeft: directions[1], ArrowUp: directions[3], ArrowDown: directions[2] };
let events = [];
let maze, player, ghosts, score, lives, gameOver;
let stopped = false;
const choose = items => items[Math.floor(Math.random() * items.length)];
const makeGhost = (x, y, color) => ({ x, y, color, direction: choose(directions), moveTimer: 0 });

function reset() {
  score = 0;
  lives = 3;
  gameOver = false;
  maze = Array.from({ length: 15 }, (_, y) => Array.from({ length: 20 }, (_, x) => {
    if (x === 0 || x === 19 || y === 0 || y === 14) return 1;
    if (!(x === 1 && y === 1) && Math.random() < 0.2) return 1;
    return Math.random() < 0.1 ? 3 : 2;
  }));
  maze[1][1] = 0;
  connectMaze();
  player = { x: 1, y: 1, direction: directions[0], mouthOpen: true, mouthTimer: 0, powered: false, powerTimer: 0 };
  ghosts = [makeGhost(18, 1, '#ff0000'), makeGhost(1, 13, '#ffc0cb'), makeGhost(18, 13, '#00ffff'), makeGhost(10, 7, '#ffa500')];
}

function connectMaze() {
  for (const [x, y] of [[18, 1], [1, 13], [18, 13], [10, 7]]) {
    if (maze[y][x] === 1) maze[y][x] = 2;
  }
  while (true) {
    const reached = new Set(['1,1']);
    const queue = [[1, 1]];
    for (let i = 0; i < queue.length; i++) {
      const [x, y] = queue[i];
      for (const [dx, dy] of directions) {
        const nx = x + dx, ny = y + dy, key = `${nx},${ny}`;
        if (valid(nx, ny) && !reached.has(key)) {
          reached.add(key);
          queue.push([nx, ny]);
        }
      }
    }
    let target = null;
    for (let y = 1; y < 14 && !target; y++) {
      for (let x = 1; x < 19; x++) {
        if (maze[y][x] !== 1 && !reached.has(`${x},${y}`)) { target = [x, y]; break; }
      }
    }
    if (!target) return;
    const [tx, ty] = target;
    let [x, y] = queue.reduce((best, cell) =>
      Math.abs(cell[0] - tx) + Math.abs(cell[1] - ty) < Math.abs(best[0] - tx) + Math.abs(best[1] - ty) ? cell : best);
    while (x !== tx || y !== ty) {
      if (x !== tx) x += Math.sign(tx - x);
      else y += Math.sign(ty - y);
      if (maze[y][x] === 1) maze[y][x] = 2;
    }
  }
}

function valid(x, y) {
  return x >= 0 && x < 20 && y >= 0 && y < 15 && maze[y][x] !== 1;
}

function movePlayer(direction) {
  const x = player.x + direction[0], y = player.y + direction[1];
  if (!valid(x, y)) return;
  player.x = x;
  player.y = y;
  player.direction = direction;
  if (maze[y][x] === 2) {
    score += 10;
    maze[y][x] = 0;
  } else if (maze[y][x] === 3) {
    score += 50;
    maze[y][x] = 0;
    player.powered = true;
    player.powerTimer = 300;
  }
}

function moveGhost(ghost) {
  if (++ghost.moveTimer < 15) return;
  ghost.moveTimer = 0;
  if (!valid(ghost.x + ghost.direction[0], ghost.y + ghost.direction[1])) {
    const possible = directions.filter(([dx, dy]) => valid(ghost.x + dx, ghost.y + dy));
    if (!possible.length) return;
    ghost.direction = choose(possible);
  }
  ghost.x += ghost.direction[0];
  ghost.y += ghost.direction[1];
}

function tick() {
  for (const code of events) {
    if (code === 'Escape') {
      stopped = true;
      events = [];
      return;
    }
    if (!gameOver && arrows[code]) {
      movePlayer(arrows[code]);
    }
    else if (gameOver && code === 'Space') reset();
  }
  events = [];
  if (gameOver) return;
  if (++player.mouthTimer >= 10) {
    player.mouthOpen = !player.mouthOpen;
    player.mouthTimer = 0;
  }
  if (player.powered && --player.powerTimer <= 0) player.powered = false;
  ghosts.forEach(moveGhost);
  for (const ghost of [...ghosts]) {
    if (ghost.x !== player.x || ghost.y !== player.y) continue;
    if (player.powered) {
      ghosts.splice(ghosts.indexOf(ghost), 1);
      score += 200;
      ghosts.push(makeGhost(10, 7, ghost.color));
    } else {
      lives--;
      if (lives <= 0) gameOver = true;
      else {
        player.x = 1;
        player.y = 1;
        for (const g of ghosts) { g.x = 18; g.y = 1; }
      }
    }
  }
  if (!maze.some(row => row.some(cell => cell === 2 || cell === 3))) gameOver = true;
}

function circle(x, y, radius, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fill();
}

function draw() {
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, 800, 600);
  for (let y = 0; y < 15; y++) {
    for (let x = 0; x < 20; x++) {
      const cell = maze[y][x];
      if (cell === 1) {
        ctx.fillStyle = '#0000ff';
        ctx.fillRect(x * 40, y * 40, 40, 40);
      } else if (cell === 2) {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x * 40 + 18, y * 40 + 18, 4, 4);
      } else if (cell === 3) circle(x * 40 + 20, y * 40 + 20, 8, '#ffffff');
    }
  }
  const px = player.x * 40 + 20, py = player.y * 40 + 20;
  if (!player.mouthOpen) circle(px, py, 18, '#ffff00');
  else {
    const [dx, dy] = player.direction;
    const [start, end] = dx === 1 ? [30, 330] : dx === -1 ? [150, 210] : dy === -1 ? [60, 120] : [240, 300];
    ctx.fillStyle = '#ffff00';
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.arc(px, py, 18, -start * Math.PI / 180, -end * Math.PI / 180, true);
    ctx.closePath();
    ctx.fill();
  }
  for (const ghost of ghosts) {
    const x = ghost.x * 40 + 20, y = ghost.y * 40 + 20;
    const color = player.powered ? '#0000ff' : ghost.color;
    circle(x, y, 18, color);
    ctx.fillRect(x - 18, y, 36, 18);
    for (const offset of [-9, 0, 9]) circle(x + offset, y + 18, 6, color);
    for (const offset of [-6, 6]) circle(x + offset, y - 6, 6, '#ffffff');
    const ox = Math.floor(ghost.direction[0] * 3 / 2), oy = Math.floor(ghost.direction[1] * 3 / 2);
    for (const offset of [-6, 6]) circle(x + offset + ox, y - 6 + oy, 3, '#000000');
  }
  ctx.font = '36px sans-serif';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(`Score: ${score}`, 10, 10);
  ctx.fillText(`Lives: ${lives}`, 680, 10);
  if (gameOver) {
    ctx.fillStyle = lives <= 0 ? '#ff0000' : '#ffff00';
    ctx.fillText(lives <= 0 ? 'Game Over! Press SPACE to restart' : 'You Win! Press SPACE to restart', 200, 300);
  }
}

window.addEventListener('keydown', event => {
  if (arrows[event.code] || event.code === 'Space') event.preventDefault();
  if (stopped || event.repeat || document.hidden) return;
  if (arrows[event.code] || event.code === 'Space' || event.code === 'Escape') events.push(event.code);
});
window.addEventListener('keyup', event => {
  if (arrows[event.code] || event.code === 'Space') event.preventDefault();
});
function clearInput() { events = []; }
window.addEventListener('blur', clearInput);
const step = 1000 / 60;
let previous = null, accumulator = 0;
document.addEventListener('visibilitychange', () => {
  clearInput();
  previous = null;
  accumulator = 0;
});
function frame(now) {
  if (stopped) return;
  if (!document.hidden) {
    if (previous !== null) accumulator += now - previous;
    previous = now;
    while (accumulator + 1e-7 >= step) {
      tick();
      accumulator -= step;
      if (stopped) return;
    }
    draw();
  } else {
    previous = null;
    accumulator = 0;
  }
  requestAnimationFrame(frame);
}
reset();
draw();
requestAnimationFrame(frame);
</script>
</body>
</html>
